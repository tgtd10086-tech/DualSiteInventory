
name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Locate project
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Recurse -Filter build_installer.py -File | Select-Object -First 1
          if (!$file) { throw "build_installer.py not found" }
          $appDir = $file.Directory.FullName
          "APP_DIR=$appDir" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:APP_DIR\requirements.txt"

      - name: Run tests
        shell: pwsh
        run: |
          Push-Location $env:APP_DIR
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build Windows application
        shell: pwsh
        run: |
          python "$env:APP_DIR\build_installer.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Setup EXE
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup not found" }
          New-Item -ItemType Directory -Force -Path "$env:APP_DIR\release" | Out-Null
          & $iscc "$env:APP_DIR\installer\DualSite.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DualSiteInventory-Windows-Setup
          path: '**/release/DualSiteInventory_Setup*.exe'
          if-no-files-found: error

