
name: Build BlackBoxShop v2.0 Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Locate v2.0 project
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Recurse -Filter build_installer.py -File |
            Where-Object { $_.FullName -match 'dual_site_manager_v2_0' })

          if ($files.Count -ne 1) {
            throw "Expected exactly one v2.0 project, found $($files.Count)"
          }

          $appDir = $files[0].Directory.FullName
          Write-Host "Building BlackBoxShop v2.0 from $appDir"
          "APP_DIR=$appDir" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:APP_DIR\requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          Push-Location $env:APP_DIR
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build Windows application
        shell: pwsh
        run: |
          python "$env:APP_DIR\build_installer.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create Setup EXE
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup not found"
          }

          $release = Join-Path $env:APP_DIR "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          & $iscc "/DMyAppOutputDir=$release" "$env:APP_DIR\installer\DualSite.iss"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: BlackBoxShop-v2.0-Windows-Setup
          path: '**/release/DualSiteInventory_Setup_v2.0.0.exe'
          if-no-files-found: error
