
      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $iss = "$env:APP_DIR\installer\DualSite.iss"
          $outputDir = 'C:\b\release'
          $output = "$outputDir\BlackBoxShop_Setup_v2.1.4.exe"
          $log = "$outputDir\inno-compile.log"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler missing: $iscc"
          }

          if (!(Test-Path $iss)) {
            throw "Installer script missing: $iss"
          }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Write-Host "Installer script: $iss"
          Write-Host "Output directory: $outputDir"

          # OutputDir and OutputBaseFilename are already
          # configured in DualSite.iss.
          # Do not override them using command-line switches.
          & $iscc $iss 2>&1 | Tee-Object -FilePath $log

          $compileExit = $LASTEXITCODE

          Write-Host "Inno Setup exit code: $compileExit"

          if ($compileExit -ne 0) {
            throw "Inno Setup compilation failed. Check $log"
          }

          if (!(Test-Path $output -PathType Leaf)) {
            throw "Installer EXE not generated: $output"
          }

          Write-Host "Installer successfully generated."
          Write-Host "File size: $((Get-Item $output).Length) bytes"
